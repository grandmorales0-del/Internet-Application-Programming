<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turbo Motors | Premium Car Dealership</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">🏎️ Turbo Motors</div>
        <nav>
            <a href="#">Home</a>
            <a href="#inventory">Inventory</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Find Your Dream Ride</h1>
        <p>Explore the finest collection of luxury and sports vehicles.</p>
        <a href="#inventory" class="btn">View Inventory</a>
    </section>

    <section id="inventory" class="inventory">
        <h2>Featured Inventory</h2>
        <div class="car-grid">
            <!-- Car 1 -->
            <div class="car-card" data-car="Apex Cruiser">
                <div class="car-img-placeholder">🏎️</div>
                <h3>Apex Cruiser</h3>
                <p>Price: $45,000</p>
                <button class="test-drive-btn">Book Test Drive</button>
            </div>
            <!-- Car 2 -->
            <div class="car-card" data-car="Vortex EV">
                <div class="car-img-placeholder">⚡</div>
                <h3>Vortex EV</h3>
                <p>Price: $62,000</p>
                <button class="test-drive-btn">Book Test Drive</button>
            </div>
            <!-- Car 3 -->
            <div class="car-card" data-car="Titan SUV">
                <div class="car-img-placeholder">🚙</div>
                <h3>Titan SUV</h3>
                <p>Price: $38,000</p>
                <button class="test-drive-btn">Book Test Drive</button>
            </div>
        </div>
    </section>

    <footer id="contact">
        <p>&copy; 2026 Turbo Motors. Built for performance.</p>
    </footer>
</body>
</html>
